name: CI

on:
    push:
        branches: [ "main", "release/**" ]
    pull_request:
        branches: [ "main", "release/**" ]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: |
                  bun run format
                  git diff --stat
                  git diff --exit-code

            - name: Lint
              run: bun run lint

            - name: Test
              run: bun test
